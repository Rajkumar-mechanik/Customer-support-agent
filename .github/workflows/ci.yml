name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The backend, tests and offline evals need only these (no AutoGen, no network, no API key).
      - run: pip install pandas openpyxl pyyaml python-dotenv
      - run: python scripts/validate_kb.py
      - run: python -m unittest discover -s tests -t .
      - run: python -m evals.run_eval
