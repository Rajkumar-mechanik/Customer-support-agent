[project]
name = "brightwell-support-desk"
version = "1.0.0"
description = "Multi-agent AI customer support desk (AutoGen v0.4, gpt-4o-mini, Streamlit)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["knowledge_base"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E501", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
